<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#0f0a0a"/>
      <stop offset="100%" style="stop-color:#1a0a0a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>
  
  <!-- Clean dark background -->
  <rect width="1280" height="640" fill="url(#bannerBg)"/>
  
  <!-- Content group - centered -->
  <g transform="translate(640, 320)">
    <!-- Omega symbol - large, centered -->
    <text x="0" y="40" 
          font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" 
          font-size="180" 
          font-weight="300" 
          text-anchor="middle" 
          fill="url(#textGrad)">Ω</text>
    
    <!-- Brand name - simple, below -->
    <text x="0" y="140" 
          font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" 
          font-size="48" 
          font-weight="600" 
          text-anchor="middle" 
          fill="#ffffff"
          letter-spacing="0.3em">OMNILLM</text>
    
    <!-- Tagline - minimal -->
    <text x="0" y="190" 
          font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" 
          font-size="16" 
          font-weight="400" 
          text-anchor="middle" 
          fill="#666666"
          letter-spacing="0.4em">UNIVERSAL INFERENCE</text>
  </g>
</svg>
