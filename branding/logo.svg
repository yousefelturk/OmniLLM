<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <!-- Clean, subtle gradient - black to deep red -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a0a0a"/>
    </linearGradient>
    
    <!-- Red accent gradient for the letter -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#991b1b"/>
    </linearGradient>
  </defs>
  
  <!-- Background - clean dark -->
  <rect width="500" height="500" fill="url(#bgGrad)" rx="0"/>
  
  <!-- Single Greek Letter Omega - geometric, clean -->
  <text x="250" y="300" 
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" 
        font-size="200" 
        font-weight="300" 
        text-anchor="middle" 
        fill="url(#letterGrad)"
        letter-spacing="-0.02em">Ω</text>
</svg>
